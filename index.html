<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-motion="full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رصد | اخبار و بازار ایران</title>
<meta name="description" content="رصد — اخبار خبرگزاری‌های ایران به سبک اینستاگرام: صفحهٔ اختصاصی هر خبرگزاری، استوری ۲۴ ساعته، ریلز، جست‌وجو، و قیمت لحظه‌ای ارز، طلا، نفت و گاز از ثروتمندی با نمودار و نظر.">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta property="og:title" content="رصد | اخبار و بازار ایران">
<meta property="og:description" content="خبرگزاری‌ها به‌صورت صفحه، پست و استوری. قیمت ارز، طلا، نفت و گاز از ثروتمندی با نمودار کامل.">
<meta property="og:image" content="assets/img/icon.svg">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="assets/img/icon.svg">
<link rel="apple-touch-icon" href="assets/img/icon.svg">
<link rel="preload" href="data/latest.json" as="fetch" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Grand+Hotel&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<script>
  // پوسته را قبل از بارگذاری اسکریپت اصلی از روی تنظیمات ذخیره‌شده/سیستم تنظیم می‌کنیم تا فلش سفید/سیاه نداشته باشیم
  (function () {
    try {
      var t = localStorage.getItem('rasad_theme') || 'system';
      var light = t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    } catch (e) {}
  })();
</script>
</head>
<body>

<!-- نوار بالا (موبایل): لوگوتایپ + اعلان‌ها + پیام‌ها — دقیقاً چیدمان اینستاگرام. محتوا بر اساس مسیر توسط app.js عوض می‌شود -->
<header class="topbar" id="topbar">
  <a class="brand" href="#/" aria-label="رصد - خانه"><span class="wordmark">Rasad</span></a>
</header>

<main id="view">
  <div class="loading"><div class="spinner"></div></div>
</main>

<!-- ناوبری: پایین در موبایل، نوار کناری در دسکتاپ (مثل اینستاگرام). آیتم‌ها توسط app.js ساخته می‌شوند -->
<nav class="bottom-nav" id="mainNav" aria-label="ناوبری اصلی"></nav>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"></div>
<div class="sheet-wrap" id="sheet" role="dialog" aria-modal="true"></div>
<div class="story-overlay" id="storyOverlay" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>

<script type="module">
  import { boot, toast } from './assets/js/app.js';

  boot({ dataBase: 'data' })
    .then(() => console.info('[rasad] آماده ✓'))
    .catch((err) => {
      console.error('[rasad] خطای راه‌اندازی:', err);
      document.getElementById('view').innerHTML =
        `<div class="empty"><h2>خطا در راه‌اندازی</h2>
         <p class="muted small">${err.message}</p>
         <p class="muted small">اگر فایل را مستقیم از دیسک باز کرده‌اید، آن را با یک سرور محلی اجرا کنید (npm run serve).</p></div>`;
    });

  window.addEventListener('offline', () => toast('اتصال قطع شد — دادهٔ ذخیره‌شده نمایش داده می‌شود', 'err'));
</script>
</body>
</html>
