<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" width="340" height="96" role="img" aria-label="رصد | Rasad">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEDA75"/>
      <stop offset="20%" stop-color="#FA7E1E"/>
      <stop offset="48%" stop-color="#D62976"/>
      <stop offset="74%" stop-color="#962FBF"/>
      <stop offset="100%" stop-color="#4F5BD5"/>
    </linearGradient>
    <linearGradient id="tile" x1="14%" y1="100%" x2="86%" y2="0%">
      <stop offset="0%" stop-color="#FEDA75"/>
      <stop offset="22%" stop-color="#FA7E1E"/>
      <stop offset="50%" stop-color="#D62976"/>
      <stop offset="76%" stop-color="#962FBF"/>
      <stop offset="100%" stop-color="#4F5BD5"/>
    </linearGradient>
  </defs>

  <!-- آیکون -->
  <g transform="translate(6,10) scale(0.59)">
    <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#tile)"/>
    <rect x="9.5" y="9.5" width="109" height="109" rx="29" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
    <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="64" cy="64" r="34" stroke-opacity=".55" stroke-width="6"/>
      <path d="M64 64 L88 46"/>
      <path d="M32 78 L46 78 L54 58 L66 90 L74 70 L96 70"/>
    </g>
    <circle cx="88" cy="46" r="8" fill="#fff"/>
  </g>

  <!-- واژه‌نمایش خط‌شکسته (مشابه سبک لوگوی اینستاگرام) -->
  <text x="96" y="62" font-family="'Grand Hotel','Billabong','Segoe Script','Brush Script MT',cursive"
        font-size="58" fill="url(#grad)" letter-spacing="1">Rasad</text>

  <!-- نام فارسی -->
  <text x="98" y="84" font-family="'Vazirmatn',Tahoma,sans-serif" font-size="17" font-weight="700"
        fill="currentColor" fill-opacity=".72">رصدِ اخبار و بازار</text>
</svg>
