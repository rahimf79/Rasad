name: Deploy to GitHub Pages

on:
  push:
    branches: [main, arena/01a0c426-rasad]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom → undici به Node >= 22.19 نیاز دارد (markAsUncloneable در worker_threads)
          node-version: '22'
          cache: npm

      - name: Install dev dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Static consistency check
        run: node scripts/lint-html.mjs

      - name: Seed archive (only if empty)
        run: |
          if [ ! -f data/index.json ]; then
            node scripts/seed.mjs
          else
            echo "archive already present — skipping seed"
          fi

      - name: Prepare Pages artifact
        run: |
          rm -rf dist && mkdir -p dist
          cp -r index.html assets data dist/
          [ -f LICENSE ] && cp LICENSE dist/ || true
          [ -f README.md ] && cp README.md dist/ || true
          [ -f CNAME ] && cp CNAME dist/ || true
          echo "$(find dist -type f | wc -l) فایل، $(du -sh dist | cut -f1)"

      # فعال‌سازی Pages نیاز به دسترسی admin دارد و با توکن ورک‌فلو ممکن نیست (403)؛
      # پس به‌جای خطای مبهم «Resource not accessible by integration»، پیش از دیپلوی بررسی می‌کنیم.
      - name: بررسی فعال بودن GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" != "200" ]; then
            echo "::error title=GitHub Pages فعال نیست::در ریپو به Settings → Pages → Build and deployment بروید و Source را روی «GitHub Actions» بگذارید، سپس این ورک‌فلو را دوباره اجرا کنید."
            exit 1
          fi
          if ! grep -q '"build_type" *: *"workflow"' /tmp/pages.json; then
            echo "::error title=منبع Pages اشتباه است::Source باید «GitHub Actions» باشد، نه «Deploy from a branch»."
            exit 1
          fi
          echo "GitHub Pages با منبع «GitHub Actions» فعال است ✓"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
