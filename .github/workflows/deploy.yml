name: Deploy to GitHub Pages

# انتشار سایت پس از تغییر کد. دادهٔ خبری/قیمتی را ورک‌فلوی collect.yml هر ۳۰ دقیقه جمع می‌کند
# و خودش هم Pages را دوباره منتشر می‌کند؛ این‌جا فقط کد + آخرین دادهٔ کامیت‌شده منتشر می‌شود.

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── تست روی هر شاخه‌ای اجرا می‌شود (چکِ PR) ────────────────────────────────
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom → undici به Node >= 22.19 نیاز دارد (markAsUncloneable در worker_threads)
          node-version: '22'
          cache: npm

      - name: Install dev dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Static consistency check
        run: node scripts/lint-html.mjs

  # ── دیپلوی فقط از شاخهٔ پیش‌فرض ────────────────────────────────────────────
  # environment «github-pages» یک branch policy دارد که فقط به main اجازه می‌دهد؛
  # و actions/deploy-pages برای توکن OIDC حتماً به همان environment نیاز دارد
  # (POST /repos/{owner}/{repo}/pages/deployments). پس از شاخه‌های دیگر فقط تست می‌گیریم.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # همان گروهی که collect.yml استفاده می‌کند تا دو انتشار روی هم نیفتند
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # اگر هنوز هیچ اجرای جمع‌آوری‌ای انجام نشده (بسته خالی یا فقط دادهٔ اولیه است)، همین‌جا یک بار داده
      # جمع می‌کنیم تا کاربر با صفحهٔ خالی روبه‌رو نشود. این داده کامیت نمی‌شود؛ اجرای بعدی collect.yml آن را کامیت می‌کند.
      - name: Check existing bundle
        id: bundle
        run: |
          if [ -f data/latest.json ] && node -e '
            const b = JSON.parse(require("fs").readFileSync("data/latest.json", "utf8"));
            process.exit((b.counts && b.counts.posts > 0) ? 0 : 1);
          '; then echo "fresh=true" >> "$GITHUB_OUTPUT"; else echo "fresh=false" >> "$GITHUB_OUTPUT"; fi

      - name: Collect fresh data for the first deploy (best effort)
        if: steps.bundle.outputs.fresh != 'true'
        timeout-minutes: 8
        continue-on-error: true
        env:
          TZ: Asia/Tehran
        run: node scripts/collect.mjs

      - name: Ensure a bundle exists
        run: |
          if [ ! -f data/latest.json ]; then
            [ -f data/index.json ] || node scripts/seed.mjs
            node scripts/collect.mjs --bundle-only
          fi
          node -e '
            const b = JSON.parse(require("fs").readFileSync("data/latest.json", "utf8"));
            console.log("bundle:", JSON.stringify(b.counts), "generatedAt:", b.generatedAtJalali);
          '

      - name: Prepare Pages artifact
        run: |
          rm -rf dist && mkdir -p dist
          cp -r index.html assets data dist/
          [ -f LICENSE ] && cp LICENSE dist/ || true
          [ -f README.md ] && cp README.md dist/ || true
          [ -f CNAME ] && cp CNAME dist/ || true
          echo "artifact: $(find dist -type f | wc -l) فایل، $(du -sh dist | cut -f1)"

      # فعال‌سازی Pages به دسترسی admin نیاز دارد و با توکن ورک‌فلو ممکن نیست (403)؛
      # پس به‌جای خطای مبهم «Resource not accessible by integration»، پیش از دیپلوی بررسی می‌کنیم.
      - name: بررسی فعال بودن GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" != "200" ]; then
            echo "::error title=GitHub Pages فعال نیست::در ریپو به Settings → Pages → Build and deployment بروید و Source را روی «GitHub Actions» بگذارید، سپس این ورک‌فلو را دوباره اجرا کنید."
            exit 1
          fi
          if ! grep -q '"build_type" *: *"workflow"' /tmp/pages.json; then
            echo "::error title=منبع Pages اشتباه است::Source باید «GitHub Actions» باشد، نه «Deploy from a branch»."
            exit 1
          fi
          echo "GitHub Pages با منبع «GitHub Actions» فعال است ✓"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
